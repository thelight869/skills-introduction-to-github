name: A-share probability research through 2026-11-06

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_URL: https://github.com/noblechang/a-share-data/releases/download/FREE_DATA_v0/ashare_pit.duckdb
  DB_SHA256: 95601e2f1f5b62595a80e735a52da3a64c7446ebe7f8c984e3394b96f90e4778
  PYTHONUNBUFFERED: '1'
  INCREMENTAL_START: '2026-09-25'
  INCREMENTAL_END: '2026-11-06'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis and market-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb numpy pandas pyarrow baostock
          python - <<'PY'
          import baostock, duckdb
          print('DuckDB', duckdb.__version__)
          print('BaoStock package', getattr(baostock, '__version__', 'unknown'))
          PY
      - name: Reassemble and verify research programs
        run: |
          set -euxo pipefail
          : > research/run_a_share_research.py
          for f in research/update20261106/run.part00.b64 research/update20261106/run.part01.b64 research/update20261106/run.part02.b64 research/update20261106/run.part03.b64; do
            base64 -d "$f" >> research/run_a_share_research.py
          done
          python - <<'PY'
          from pathlib import Path

          path = Path('research/run_a_share_research.py')
          text = path.read_text(encoding='utf-8')
          old_stream = 'con.execute(query).fetch_record_batch(rows_per_batch=200_000)'
          new_stream = 'con.sql(query).to_arrow_reader(batch_size=200_000)'
          old_view = '    con.execute(f"CREATE VIEW samples AS SELECT * FROM read_parquet(\'{sample_path.as_posix()}\')")'
          new_view = "\n".join([
              "    con.close()",
              "    con = duckdb.connect()",
              "    con.execute(\"PRAGMA threads=4\")",
              "    con.execute(\"PRAGMA memory_limit='5GB'\")",
              "    con.execute(f\"PRAGMA temp_directory='{WORK_DIR.as_posix()}/duckdb_tmp'\")",
              "    con.execute(f\"CREATE VIEW samples AS SELECT * FROM read_parquet('{sample_path.as_posix()}')\")",
          ])
          for old, new in [(old_stream, new_stream), (old_view, new_view)]:
              if old not in text:
                  raise SystemExit(f'Expected research code fragment not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          fetch_path = Path('research/fetch_baostock_incremental.py')
          fetch = fetch_path.read_text(encoding='utf-8')
          end_line = 'END_DATE = os.environ.get("INCREMENTAL_END", "2026-11-06")\n'
          shard_block = end_line + 'SHARD_COUNT = int(os.environ.get("SHARD_COUNT", "1"))\nSHARD_INDEX = int(os.environ.get("SHARD_INDEX", "0"))\n'
          if end_line not in fetch:
              raise SystemExit('END_DATE anchor not found')
          fetch = fetch.replace(end_line, shard_block, 1)
          candidate_anchor = '        log(\n            f"Incremental candidates='
          candidate_insert = '        all_candidate_count = len(candidates)\n        candidates = candidates[SHARD_INDEX::SHARD_COUNT]\n\n' + candidate_anchor
          if candidate_anchor not in fetch:
              raise SystemExit('Candidate anchor not found')
          fetch = fetch.replace(candidate_anchor, candidate_insert, 1)
          metadata_anchor = '                "new_current_a_share_count": len(new_current),\n'
          metadata_insert = metadata_anchor + '                "all_candidate_queries": all_candidate_count,\n                "shard_count": SHARD_COUNT,\n                "shard_index": SHARD_INDEX,\n'
          if metadata_anchor not in fetch:
              raise SystemExit('Metadata anchor not found')
          fetch = fetch.replace(metadata_anchor, metadata_insert, 1)
          fetch = fetch.replace('if summary["last_date"] != END_DATE:', 'if str(summary["last_date"])[:10] != END_DATE:', 1)
          fetch = fetch.replace('if int(summary["traded_on_end"]) < 5000:', 'if SHARD_COUNT == 1 and int(summary["traded_on_end"]) < 5000:', 1)
          fetch_path.write_text(fetch, encoding='utf-8')
          PY
          python -m py_compile research/run_a_share_research.py
          python -m py_compile research/fetch_baostock_incremental.py
          sha256sum research/run_a_share_research.py research/fetch_baostock_incremental.py
      - name: Download and verify baseline all-market database
        run: |
          set -euxo pipefail
          curl -L --fail --retry 8 --retry-delay 10 --continue-at - "$DB_URL" -o ashare_pit.duckdb
          echo "$DB_SHA256  ashare_pit.duckdb" | sha256sum -c -
          ls -lh ashare_pit.duckdb
          free -h
          df -h .
      - name: Fetch BaoStock increment in four independent shards
        run: |
          set +e
          mkdir -p incremental output work/duckdb_tmp
          pids=()
          for i in 0 1 2 3; do
            mkdir -p "incremental/shard${i}"
            SHARD_COUNT=4 SHARD_INDEX="$i" INCREMENTAL_DIR="incremental/shard${i}" \
              python research/fetch_baostock_incremental.py > "incremental/shard${i}/fetch.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for i in 0 1 2 3; do
            wait "${pids[$i]}"
            rc=$?
            echo "shard $i exit code $rc"
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          for i in 0 1 2 3; do
            echo "===== SHARD $i =====" | tee -a output/incremental_fetch.log
            cat "incremental/shard${i}/fetch.log" | tee -a output/incremental_fetch.log
          done
          if [ "$status" -ne 0 ]; then
            echo "At least one BaoStock shard failed" | tee -a output/incremental_fetch.log
            exit 1
          fi
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          import duckdb
          import pandas as pd

          shard_dirs = [Path(f'incremental/shard{i}') for i in range(4)]
          metas = [json.loads((d/'incremental_meta.json').read_text(encoding='utf-8')) for d in shard_dirs]
          con = duckdb.connect()
          con.execute("""
              COPY (
                  SELECT * FROM read_parquet('incremental/shard*/incremental_bars.parquet')
              ) TO 'incremental/incremental_bars.parquet'
              (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
          """)
          row = con.execute("""
              SELECT COUNT(*)::BIGINT AS rows,
                     COUNT(DISTINCT security_id)::BIGINT AS securities,
                     COUNT(DISTINCT trade_date)::BIGINT AS trading_dates,
                     MIN(trade_date) AS first_date,
                     MAX(trade_date) AS last_date,
                     COUNT(DISTINCT CASE WHEN trade_date=DATE '2026-11-06' AND tradestatus=1 AND volume>0 THEN security_id END)::BIGINT AS traded_on_end,
                     COUNT(*) - COUNT(DISTINCT security_id || '|' || CAST(trade_date AS VARCHAR)) AS duplicate_keys
              FROM read_parquet('incremental/incremental_bars.parquet')
          """).fetchdf().iloc[0].to_dict()
          con.close()
          summary = {
              'rows': int(row['rows']),
              'securities': int(row['securities']),
              'trading_dates': int(row['trading_dates']),
              'first_date': str(row['first_date'])[:10],
              'last_date': str(row['last_date'])[:10],
              'traded_on_end': int(row['traded_on_end']),
              'duplicate_keys': int(row['duplicate_keys']),
              'requested_start': '2026-09-25',
              'requested_end': '2026-11-06',
              'candidate_queries': sum(int(m['candidate_queries']) for m in metas),
              'successful_queries': sum(int(m['successful_queries']) for m in metas),
              'empty_queries': sum(int(m['empty_queries']) for m in metas),
              'persistent_failures': sum(int(m['persistent_failures']) for m in metas),
              'baseline_security_count': int(metas[0]['baseline_security_count']),
              'new_current_a_share_count': int(metas[0]['new_current_a_share_count']),
              'shards': 4,
          }
          if summary['last_date'] != '2026-11-06':
              raise SystemExit(f"Incremental data is stale: {summary['last_date']}")
          if summary['traded_on_end'] < 5000:
              raise SystemExit(f"Low end-date market coverage: {summary['traded_on_end']}")
          if summary['persistent_failures'] != 0:
              raise SystemExit(f"Persistent failures: {summary['persistent_failures']}")
          if summary['duplicate_keys'] != 0:
              raise SystemExit(f"Duplicate incremental keys: {summary['duplicate_keys']}")

          failures = []
          for d in shard_dirs:
              p = d/'query_failures.csv'
              try:
                  frame = pd.read_csv(p)
                  if not frame.empty: failures.append(frame)
              except pd.errors.EmptyDataError:
                  pass
          failure_df = pd.concat(failures, ignore_index=True) if failures else pd.DataFrame(columns=['code','error_code','error_msg'])
          failure_df.to_csv('incremental/query_failures.csv', index=False, encoding='utf-8-sig')
          for name in ['trade_dates.csv','stock_basic_current.csv','new_security_master.csv']:
              source = shard_dirs[0]/name
              if source.exists():
                  Path('incremental', name).write_bytes(source.read_bytes())
          Path('incremental/incremental_meta.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('output/incremental_meta.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          for name in ['trade_dates.csv','stock_basic_current.csv','new_security_master.csv','query_failures.csv']:
              source = Path('incremental', name)
              if source.exists(): Path('output', name).write_bytes(source.read_bytes())
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Build verified combined database
        run: |
          set -euxo pipefail
          cp ashare_pit.duckdb ashare_full_20261106.duckdb
          python - <<'PY'
          import json
          from pathlib import Path
          import duckdb
          import pandas as pd

          db = 'ashare_full_20261106.duckdb'
          con = duckdb.connect(db)
          baseline_max = con.execute('SELECT MAX(trade_date) FROM bars').fetchone()[0]
          before_rows = con.execute('SELECT COUNT(*) FROM bars').fetchone()[0]
          con.execute("""
              INSERT INTO bars
              SELECT security_id, trade_date, open, high, low, close, preclose,
                     volume, amount, adjustflag, turn, tradestatus, pctChg, isST
              FROM read_parquet('incremental/incremental_bars.parquet')
              WHERE trade_date > ?
          """, [baseline_max])

          current = pd.read_csv('incremental/stock_basic_current.csv', dtype=str).fillna('')
          current = current[current['type'] == '1'].copy()
          current['exchange'] = current['code'].str[:2].map({'sh': 'SSE', 'sz': 'SZSE'})
          current['symbol'] = current['code'].str[3:]
          current = current[
              ((current['exchange'] == 'SSE') & current['symbol'].str.startswith(('600','601','603','605','688','689')))
              | ((current['exchange'] == 'SZSE') & current['symbol'].str.startswith(('000','001','002','003','300','301')))
          ].copy()
          current['security_id'] = 'CN:' + current['exchange'] + ':' + current['symbol']
          con.register('current_basic_df', current)
          con.execute("""
              UPDATE security_master AS sm
              SET name = cb.code_name,
                  list_date = TRY_CAST(NULLIF(cb.ipoDate, '') AS DATE),
                  delist_date = TRY_CAST(NULLIF(cb.outDate, '') AS DATE),
                  status = TRY_CAST(cb.status AS BIGINT)
              FROM current_basic_df AS cb
              WHERE sm.security_id = cb.security_id
          """)
          con.execute("""
              INSERT INTO security_master
              SELECT cb.security_id, cb.exchange, cb.symbol, cb.code,
                     cb.code_name,
                     TRY_CAST(NULLIF(cb.ipoDate, '') AS DATE),
                     TRY_CAST(NULLIF(cb.outDate, '') AS DATE),
                     TRY_CAST(cb.status AS BIGINT)
              FROM current_basic_df cb
              LEFT JOIN security_master sm USING (security_id)
              WHERE sm.security_id IS NULL
          """)

          after_rows = con.execute('SELECT COUNT(*) FROM bars').fetchone()[0]
          latest = con.execute('SELECT MAX(trade_date) FROM bars').fetchone()[0]
          latest_count = con.execute("SELECT COUNT(DISTINCT security_id) FROM bars WHERE trade_date=DATE '2026-11-06' AND tradestatus=1 AND volume>0").fetchone()[0]
          duplicates = con.execute("""
              SELECT COUNT(*) FROM (
                  SELECT security_id, trade_date, COUNT(*) AS n
                  FROM bars
                  GROUP BY 1,2
                  HAVING COUNT(*) > 1
              )
          """).fetchone()[0]
          validation = {
              'baseline_max_date': str(baseline_max),
              'combined_max_date': str(latest),
              'baseline_rows': int(before_rows),
              'combined_rows': int(after_rows),
              'appended_rows': int(after_rows - before_rows),
              'traded_securities_on_2026_11_06': int(latest_count),
              'duplicate_security_date_keys': int(duplicates),
              'security_master_rows': int(con.execute('SELECT COUNT(*) FROM security_master').fetchone()[0]),
          }
          Path('output/combined_database_validation.json').write_text(json.dumps(validation, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          if str(latest) != '2026-11-06':
              raise SystemExit(f'Combined database is stale: {latest}')
          if latest_count < 5000:
              raise SystemExit(f'Low 2026-11-06 market coverage: {latest_count}')
          if duplicates != 0:
              raise SystemExit(f'Duplicate security/date keys found: {duplicates}')
          con.close()
          PY
          sha256sum ashare_full_20261106.duckdb > output/combined_database_sha256.txt
      - name: Run full 2016-2026 eight-indicator research
        env:
          DB_PATH: ashare_full_20261106.duckdb
          OUT_DIR: output
          WORK_DIR: work
        run: |
          set -o pipefail
          python research/run_a_share_research.py 2>&1 | tee output/run.log
          status=${PIPESTATUS[0]}
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee -a output/run.log
          exit $status
      - name: Upload updated research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-probability-research-20261106
          path: output/
          if-no-files-found: warn
          retention-days: 7
