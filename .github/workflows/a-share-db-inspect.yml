name: A-share probability research

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_URL: https://github.com/noblechang/a-share-data/releases/download/FREE_DATA_v0/ashare_pit.duckdb
  DB_SHA256: 95601e2f1f5b62595a80e735a52da3a64c7446ebe7f8c984e3394b96f90e4778
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb numpy pandas pyarrow
          python - <<'PY'
          import duckdb
          print('DuckDB', duckdb.__version__)
          PY
      - name: Reassemble and verify research program
        run: |
          set -euxo pipefail
          : > research/run_a_share_research.py
          for f in research/run_a_share_research.part00.b64 research/run_a_share_research.part01.b64 research/run_a_share_research.part02.b64 research/run_a_share_research.part03.b64; do
            base64 -d "$f" >> research/run_a_share_research.py
          done
          python - <<'PY'
          from pathlib import Path
          path = Path('research/run_a_share_research.py')
          text = path.read_text(encoding='utf-8')
          old = 'con.execute(query).fetch_record_batch(rows_per_batch=200_000)'
          new = 'con.sql(query).to_arrow_reader(batch_size=200_000)'
          if old not in text:
              raise SystemExit('Expected DuckDB 1.x streaming call not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile research/run_a_share_research.py
          wc -l -c research/run_a_share_research.py
          sha256sum research/run_a_share_research.py
      - name: Download and verify public A-share database
        run: |
          set -euxo pipefail
          curl -L --fail --retry 8 --retry-delay 10 --continue-at - "$DB_URL" -o ashare_pit.duckdb
          echo "$DB_SHA256  ashare_pit.duckdb" | sha256sum -c -
          ls -lh ashare_pit.duckdb
          free -h
          df -h .
      - name: Run full 2016-2026 eight-indicator research
        run: |
          set -o pipefail
          mkdir -p output work/duckdb_tmp
          python research/run_a_share_research.py 2>&1 | tee output/run.log
          status=${PIPESTATUS[0]}
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee -a output/run.log
          exit $status
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-probability-research
          path: output/
          if-no-files-found: warn
          retention-days: 7
